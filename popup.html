<!DOCTYPE html>
<html lang="en">

<head>
    <title>Domain Notes</title>
    <script src="popup.js" defer></script>
    <meta charset='UTF-8' />
    <link rel="stylesheet" href="https://unpkg.com/98.css" />
    <style>
        #loadingIndicator {
            display: none;
        }

        .style-generation {
            padding: 5px;
            border: 1px solid #ccc;
        }
        .style-generation * {
            padding: 5px;
        }

        /* replace the default font provided by 98.css with a more readable one that supports emojis */
        body, * {
            font-family: Arial, sans-serif,  !important;
        }

        button, .style-generation-note , #notes {
            font-size: 14px !important;
            font-weight: bold !important;
        }

        .style-generation-copy-button {
            font-size: 13px !important;
            font-weight: bold !important;
            margin-left: 10px;
        }

        #contextControl div { 
            border: 1px solid black;
            background: #dfdd9a;
            margin-bottom: 10px;
            padding: 5px;
            font-size: 12px !important;
        }

        #advanced-options-toggle {
            cursor: pointer;
            user-select: none;
        }
    </style>
</head>

<body style="width: 425px; margin: 2px; padding: 2px" class="window">

    <div class="title-bar">
        <div class="title-bar-text">🎨 AI Page Style Editor</div>
        </h3>
    </div>

    <!-- The area where we display committed style generations that can be regenerated, modified and applied, or removed -->
    <div id="style-generations"
        style="display: none;">
    </div>

    <textarea id="notes" placeholder="Enter changes here..."
        style="width: 425px; height: 100px; padding: 10px;"></textarea><br />
    <fieldset style="margin: 5px;">
        <button id="save" style="padding: 5px;">🖌️ Generate &amp; Apply</button>
        <button id="clear" style="padding: 5px;">🗑️ Reset Page</button>
        <img id="loadingIndicator" src="loading.webp" style="display: none; width: 100px; float: right;">
    </fieldset>
    <fieldset style="margin: 0px; padding: 0px; border-left: none; border-right: none;" id="advanced-options">
        <legend id="advanced-options-toggle">▶ Advanced options</legend>
        <div id="advanced-options-content" style="display: none;">
            <fieldset style="margin: 5px;" id="contextControl">
                <div>Elements in context: 0 (default) ℹ️ </div>
                <button id="addElementToContext" style="padding: 5px;">➕ Add Elements To Context</button>
                <button id="resetContext" style="padding: 5px;">✖️ Reset Context</button>
            </fieldset>
            <fieldset style="margin: 5px;">
                <legend>Configuration</legend>
                <div class="field-row-stacked">
                    <label for="apiKey">API Key</label>
                    <input id="apiKey" type="password" />
                </div>
                <div class="field-row-stacked">
                    <label for="modelEndpoint">Model Endpoint</label>
                    <input id="modelEndpoint" type="text" value="https://api.openai.com/v1/chat/completions" />
                </div>
                <div class="field-row-stacked">
                    <label for="modelName">Model Name</label>
                    <input id="modelName" type="text" value="gpt-4.1" />
                </div>
            </fieldset>
        </div>
    </fieldset>
</body>

</html>
