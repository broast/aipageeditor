<!DOCTYPE html>
<html lang="en">

<head>
    <title>Domain Notes</title>
    <script src="popup.js" defer></script>
    <meta charset='UTF-8' />
    <link rel="stylesheet" href="https://unpkg.com/98.css" />
    <style>
        #loadingIndicator {
            display: none;
        }

        .style-generation {
            padding: 5px;
            border: 1px solid #ccc;
        }
        .style-generation * {
            padding: 5px;
        }

        /* replace the default font provided by 98.css with a more readable one that supports emojis */
        body, * {
            font-family: Arial, sans-serif,  !important;
            font-weight: bold !important;
        }

        button, .style-generation-note , #notes {
            font-size: 14px !important;
            font-weight: bold !important;
        }

        .style-generation-copy-button {
            font-size: 13px !important;
            font-weight: bold !important;
            margin-left: 10px;
        }

        .style-generation-note {
            padding: 0px;
        }

        #contextControl div { 
            border: 1px solid black;
            background: #dfdd9a;
            margin-bottom: 10px;
            padding: 5px;
            font-size: 12px !important;
        }

        #advanced-options-toggle {
            cursor: pointer;
            user-select: none;
        }

        #advanced-options-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.07s ease-out;
        }
    </style>
</head>

<body style="width: 425px; margin: 2px; padding: 2px" class="window">

    <div class="title-bar">
        <div class="title-bar-text">🎨 AI Page Style Editor</div>
        </h3>
    </div>

    <!-- The area where we display committed style generations that can be regenerated, modified and applied, or removed -->
    <div id="style-generations"
        style="display: none;">
    </div>

    <textarea id="notes" placeholder="Enter changes here..."
        style="width: 425px; height: 100px; padding: 10px;"></textarea><br />
    <fieldset style="margin: 5px; position: relative;">
        <button id="save" style="padding: 5px;">🖌️ Generate &amp; Apply</button>
        <button id="clear" style="padding: 5px;">🗑️ Reset Page</button>
        <input type="checkbox" id="global-style-checkbox" style="margin-left: 10px;"/>
        <label for="global-style-checkbox">Global Style</label>
        <img id="loadingIndicator" src="loading.webp" style="display: none; position:absolute; top: -50%; right: -25px; width: 100px;">
    </fieldset>
    <fieldset style="margin: 0px; padding: 0px; border-left: none; border-right: none; border-bottom:none;" id="advanced-options">
        <legend id="advanced-options-toggle">▶ Advanced options</legend>
        <div id="advanced-options-content">
            <menu role="tablist" style="margin-top: 10px;">
                <li role="tab" aria-selected="true"><a href="#context-tab">Context</a></li>
                <li role="tab"><a href="#model-tab">Model Configuration</a></li>
            </menu>
            <div class="window" role="tabpanel" id="context-tab">
                <div class="window-body">
                    <div id="contextControl">
                        <input type="checkbox" id="includeDefaultContext" checked>
                        <label for="includeDefaultContext">Include default context</label>
                        <br>
                        <input type="checkbox" id="sendScreenshot">
                        <label for="sendScreenshot">Send Screenshot</label>
                        <div style="margin-top: 10px">Elements in context: 0 (default) ℹ️ </div>
                        <button id="addElementToContext" style="padding: 5px;">➕ Add Elements To Context</button>
                        <button id="resetContext" style="padding: 5px;">✖️ Reset Context</button>
                    </div>
                </div>
            </div>
            <div class="window" role="tabpanel" id="model-tab" style="display: none;">
                <div class="window-body">
                    <div class="field-row-stacked">
                        <label for="apiKey">API Key</label>
                        <input id="apiKey" type="password" />
                    </div>
                    <div class="field-row-stacked">
                        <label for="modelEndpoint">Model Endpoint</label>
                        <input id="modelEndpoint" type="text" value="https://api.openai.com/v1/chat/completions" />
                    </div>
                    <div class="field-row-stacked">
                        <label for="modelName">Model Name</label>
                        <input id="modelName" type="text" value="gpt-4.1" />
                    </div>
                </div>
            </div>
        </div>
    </fieldset>
</body>

</html>
